# Алерты homeserver. Считает этот Prometheus, шлёт в Alertmanager на VPS vaibkod
# (alerts.infra.vaibkod.online → бот @VaibkodVPS_bot через tg-relay worker).
# instance: homeserver — чтобы в Telegram было «host: homeserver», а не имя экспортера.
groups:
  - name: homeserver-raid
    rules:
      - alert: HomeserverRaidDegraded
        expr: node_md_disks_required - ignoring(state) node_md_disks{state="active"} > 0
        for: 1m
        labels: { severity: critical, instance: homeserver }
        annotations:
          summary: "homeserver: RAID {{ $labels.device }} деградировал"
          description: "Активных дисков меньше, чем нужно массиву. md0 — данные на HDD, md2 — корень, md3 — swap. Смотри cat /proc/mdstat."

      - alert: HomeserverRaidDiskFailed
        expr: node_md_disks{state="failed"} > 0
        labels: { severity: critical, instance: homeserver }
        annotations:
          summary: "homeserver: в {{ $labels.device }} диск помечен failed"

      - alert: HomeserverRaidRebuilding
        expr: node_md_state{state=~"recovering|resync"} == 1
        for: 5m
        labels: { severity: warning, instance: homeserver }
        annotations:
          summary: "homeserver: {{ $labels.device }} в {{ $labels.state }}"
          description: "Массив перестраивается — до конца без второй копии."

  - name: homeserver-disks
    rules:
      - alert: HomeserverSmartFailed
        expr: smart_health_passed == 0
        labels: { severity: critical, instance: homeserver }
        annotations:
          summary: "homeserver: SMART FAILED на {{ $labels.device }}"
          description: "{{ $labels.model }} {{ $labels.serial }}"

      - alert: HomeserverDiskBadSectors
        expr: smart_ata_attribute_raw{attr=~"reallocated_sectors|pending_sectors|offline_uncorrectable"} > 0
        labels: { severity: warning, instance: homeserver }
        annotations:
          summary: "homeserver: {{ $labels.device }} {{ $labels.attr }} = {{ $value }}"
          description: "{{ $labels.model }} {{ $labels.serial }}. Было 0 — диск начал сыпаться, готовь замену."

      - alert: HomeserverDiskCrcErrors
        expr: increase(smart_ata_attribute_raw{attr="udma_crc_errors"}[2h]) > 0
        labels: { severity: warning, instance: homeserver }
        annotations:
          summary: "homeserver: CRC-ошибки SATA на {{ $labels.device }}"
          description: "Обычно кабель или разъём, не сам диск."

      - alert: HomeserverNvmeMediaErrors
        expr: smart_nvme_media_errors > 0
        labels: { severity: warning, instance: homeserver }
        annotations:
          summary: "homeserver: media errors на {{ $labels.device }} = {{ $value }}"
          description: "{{ $labels.model }} {{ $labels.serial }}"

      - alert: HomeserverNvmeCritical
        expr: smart_nvme_critical_warning > 0 or smart_nvme_available_spare < smart_nvme_available_spare_threshold
        labels: { severity: critical, instance: homeserver }
        annotations:
          summary: "homeserver: NVMe {{ $labels.device }} critical warning / кончился запас"
          description: "{{ $labels.model }} {{ $labels.serial }}"

      - alert: HomeserverNvmeWornOut
        expr: smart_nvme_percentage_used >= 90
        labels: { severity: warning, instance: homeserver }
        annotations:
          summary: "homeserver: NVMe {{ $labels.device }} износ {{ $value }}%"

      - alert: HomeserverDiskHot
        expr: (smart_temperature_celsius{type="sat"} > 50) or (smart_temperature_celsius{type="nvme"} > 70)
        for: 10m
        labels: { severity: warning, instance: homeserver }
        annotations:
          summary: "homeserver: {{ $labels.device }} {{ $value }}°C"
          description: "HDD выше 50°C / NVMe выше 70°C 10 минут. Летом на балконе — проверь вытяжку."

      - alert: HomeserverSmartStale
        expr: time() - node_textfile_mtime_seconds{file=~".*smart.prom"} > 7200
        for: 10m
        labels: { severity: warning, instance: homeserver }
        annotations:
          summary: "homeserver: SMART не обновлялся больше 2 часов"
          description: "systemctl status homeserver-smart.timer"

      - alert: HomeserverFilesystemLow
        expr: node_filesystem_avail_bytes{mountpoint=~"/|/mnt/raid_hdd"} / node_filesystem_size_bytes < 0.10
        for: 15m
        labels: { severity: warning, instance: homeserver }
        annotations:
          summary: "homeserver: на {{ $labels.mountpoint }} свободно меньше 10%"

  - name: homeserver-gpu
    rules:
      - alert: HomeserverGpuMissing
        expr: homeserver_gpu_present == 0
        for: 2m
        labels: { severity: critical, instance: homeserver }
        annotations:
          summary: "homeserver: пропала GPU {{ $labels.role }}"
          description: "{{ $labels.uuid }} нет в nvidia-smi. Скорее всего Xid 79 (райзер/питание) — лечится только выключением по питанию."

      - alert: HomeserverNvidiaSmiDown
        expr: homeserver_nvidia_smi_ok == 0
        for: 5m
        labels: { severity: critical, instance: homeserver }
        annotations:
          summary: "homeserver: nvidia-smi не отвечает"
          description: "Драйвер завис или карта отвалилась так, что NVML не поднимается."

      - alert: HomeserverGpuXid
        expr: DCGM_FI_DEV_XID_ERRORS > 0
        labels: { severity: warning, instance: homeserver }
        annotations:
          summary: "homeserver: Xid {{ $value }} на {{ $labels.UUID }}"
          description: "journalctl -b -k | grep -i xid"

      - alert: HomeserverGpuHot
        expr: DCGM_FI_DEV_GPU_TEMP > 85
        for: 5m
        labels: { severity: warning, instance: homeserver }
        annotations:
          summary: "homeserver: GPU {{ $labels.UUID }} {{ $value }}°C"
          description: "При лимите 130 Вт норма 73–75°C под нагрузкой."

      - alert: HomeserverCpuHot
        expr: max by (chip) (node_hwmon_temp_celsius{chip="platform_coretemp_0"}) > 90
        for: 5m
        labels: { severity: warning, instance: homeserver }
        annotations:
          summary: "homeserver: CPU {{ $value }}°C"

      - alert: HomeserverComfyuiSingleGpu
        expr: homeserver_comfyui_single_gpu == 1
        labels: { severity: warning, instance: homeserver }
        annotations:
          summary: "homeserver: ComfyUI переключён на одну карту"
          description: "x1-карта 47984de7 пропала, сторож перевёл кристаллы на одну x4-карту (~100 с вместо ~50). Вернёт сам, когда карта будет видна 5 минут."

  - name: homeserver-services
    rules:
      - alert: HomeserverContainerDown
        expr: homeserver_container_ok{name!~"caddy|saiga-llm|saiga-comfyui"} == 0
        for: 3m
        labels: { severity: warning, instance: homeserver }
        annotations:
          summary: "homeserver: контейнер {{ $labels.name }} не работает"
          description: "Остановлен или unhealthy."

      - alert: HomeserverCriticalContainerDown
        expr: homeserver_container_ok{name=~"caddy|saiga-llm|saiga-comfyui"} == 0
        for: 3m
        labels: { severity: critical, instance: homeserver }
        annotations:
          summary: "homeserver: {{ $labels.name }} не работает"
          description: "Без него на healspirit не работают Кот Судьбы / кристаллы (или весь вход, если это caddy)."

      - alert: HomeserverWatchdogStale
        expr: time() - node_textfile_mtime_seconds{file=~".*watchdog.prom"} > 300
        for: 5m
        labels: { severity: warning, instance: homeserver }
        annotations:
          summary: "homeserver: сторож не обновлялся 5+ минут"
          description: "systemctl status homeserver-watchdog.timer — подстраховка ComfyUI тоже не работает."

      - alert: HomeserverExporterDown
        expr: up == 0
        for: 5m
        labels: { severity: warning, instance: homeserver }
        annotations:
          summary: "homeserver: экспортер {{ $labels.job }} не отвечает"
