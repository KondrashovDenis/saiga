services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      default:
        # Caddy — балансировщик LLM (Caddyfile, http://:5000): клиенты по-прежнему ходят на saiga-llm:5000
        aliases: [saiga-llm]

volumes:
  caddy-data:
  caddy-config:

networks:
  default:
    name: nginx-proxy
    external: true
